[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroloop"
version = "0.2.0"
description = "Evidence-backed multimodal creative regeneration with a shared notebook runtime"
requires-python = ">=3.11"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn>=0.32,<1", "pydantic-settings>=2.7,<3",
 "python-multipart>=0.0.22", "SQLAlchemy>=2.0,<3", "httpx>=0.28,<1",
 "python-dotenv>=1,<2", "Pillow>=11", "alembic>=1.14,<2", "filelock>=3.16,<4"
]

[project.optional-dependencies]
production = ["psycopg[binary]>=3.2,<4", "boto3>=1.35,<2"]
notebook = ["marimo>=0.19", "numpy>=2.1,<3", "weave>=0.52", "mcp>=1.28,<2"]
telemetry = ["wandb>=0.22,<1"]
documents = ["pypdf>=5,<7", "python-docx>=1.1,<2"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25"]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["neuroloop_app*", "neuroloop"]

[tool.setuptools.package-data]
"neuroloop_app.h3_support" = ["LICENSE.AGPL-3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
addopts = "-ra"
